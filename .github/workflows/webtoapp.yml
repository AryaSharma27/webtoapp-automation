name: Build Flutter WebToApp

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Project
        run: |
          project_name="propero"
          flutter create "$project_name"
          echo "sanitized_project_name=$project_name" >> $GITHUB_ENV

      - name: Add Dependencies
        run: |
          cd "$sanitized_project_name"
          flutter pub add webview_flutter
          flutter pub add onesignal_flutter
          flutter pub add flutter_launcher_icons --dev

      - name: Create Assets Folder
        run: |
          cd "$sanitized_project_name"
          mkdir -p assets
          touch assets/images.png

      - name: Update main.dart
        run: |
          cd "$sanitized_project_name/lib"
          cat <<EOF > main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});

            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse("https://speed.propero.in/webapp"));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(controller: controller),
                ),
              );
            }
          }
          EOF

      # 🔐 Decode Keystore
      - name: Decode Keystore
        run: |
          cd "$sanitized_project_name/android/app"
          echo "${{ secrets.KEYSTORE_BASE64 }}" > keystore.b64
          base64 --decode keystore.b64 > release-key.jks
          rm keystore.b64

      # 🔐 Create key.properties
      - name: Create key.properties
        run: |
          cd "$sanitized_project_name/android"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=app/release-key.jks" >> key.properties

      - name: Build Android APK
        run: |
          cd "$sanitized_project_name"
          flutter build apk --release

      - name: Build Android AAB
        run: |
          cd "$sanitized_project_name"
          flutter build appbundle --release

      - name: Build iOS IPA (No Code Sign)
        run: |
          cd "$sanitized_project_name"
          flutter build ipa --no-codesign

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WEBTOAPP
          path: |
            ${{ github.workspace }}/${{ env.sanitized_project_name }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ github.workspace }}/${{ env.sanitized_project_name }}/build/app/outputs/bundle/release/app-release.aab
            ${{ github.workspace }}/${{ env.sanitized_project_name }}/build/ios/ipa/*.ipa
